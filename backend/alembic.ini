# DeskMind Alembic configuration

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = "@"
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/deskmind

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter =

[formatter_generic]
format = %(message)s